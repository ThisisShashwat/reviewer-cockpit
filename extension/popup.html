<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cockpit Quick Ingest Helper</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121216;
      color: #e5e7eb;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
    }
    .badge {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
      border: 1px solid rgba(249, 115, 22, 0.4);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #71717a;
      margin-bottom: 6px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    button.btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      transition: all 0.15s ease;
    }
    button.btn-primary {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      box-shadow: 0 1px 4px rgba(249, 115, 22, 0.3);
    }
    button.btn-primary:hover {
      background: linear-gradient(135deg, #ea580c, #c2410c);
    }
    button.btn-secondary {
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
    }
    button.btn-secondary:hover {
      background: #3f3f46;
      color: #fff;
    }
    .input-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    input[type="text"] {
      flex: 1;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 5px 8px;
      color: #f4f4f5;
      font-size: 11px;
      font-family: monospace;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #f97316;
    }
    button.btn-save {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-save:hover {
      background: #3f3f46;
    }
    .status-msg {
      font-size: 11px;
      margin-top: 6px;
      text-align: center;
      min-height: 16px;
    }
    .status-msg.success { color: #34d399; }
    .status-msg.error { color: #f87171; }
    .footer {
      font-size: 10px;
      color: #71717a;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>⚡</span>
      <span>Cockpit Helper</span>
    </div>
    <span class="badge">v1.1</span>
  </div>

  <div class="section-title">Queue Actions</div>
  <div class="card actions">
    <button class="btn btn-primary" id="btn-sync-all">
      <span>⚡</span>
      <span id="sync-label">Sync All 4 Tabs to Cockpit</span>
    </button>
    <button class="btn btn-secondary" id="btn-copy-all">
      <span>📋</span>
      <span id="copy-label">Copy All Visible JSON</span>
    </button>
    <div class="status-msg" id="status-msg"></div>
  </div>

  <div class="section-title">Reviewer Cockpit Server</div>
  <div class="card">
    <div style="font-size: 11px; color: #a1a1aa; margin-bottom: 4px;">Server Address:</div>
    <div class="input-group">
      <input type="text" id="server-url-input" value="http://100.68.188.57:3001" />
      <button class="btn-save" id="btn-save-url">Save</button>
    </div>
  </div>

  <div class="footer">
    Works on live.hackclub.com/review & Airtable
  </div>

  <script src="popup.js"></script>
</body>
</html>
